version: "3.9"

services:
  xray-proxy:
    build: ./xray-proxy
    container_name: xray-proxy
    env_file:
      - .env
    volumes:
      - ./xray-config:/etc/xray
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 10808 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  hev-tunnel:
    image: ghcr.io/heiher/hev-socks5-tunnel:latest
    container_name: hev-tunnel
    depends_on:
      xray-proxy:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TUN: tun0
      MTU: 8500
      IPV4: 198.18.0.1
      TABLE: 20
      MARK: 438
      SOCKS5_ADDR: xray-proxy
      SOCKS5_PORT: 10808
      SOCKS5_UDP_MODE: udp
      IPV4_INCLUDED_ROUTES: 0.0.0.0/0
      IPV4_EXCLUDED_ROUTES: 198.18.0.1
      LOG_LEVEL: info
    dns:
      - 8.8.8.8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO/dev/null --timeout=5 http://1.1.1.1 || curl -fsS --max-time 5 http://1.1.1.1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  python-bot:
    build: .
    container_name: pushmo0n-bot
    depends_on:
      hev-tunnel:
        condition: service_healthy
    network_mode: "service:hev-tunnel"
    env_file:
      - .env
    restart: unless-stopped
